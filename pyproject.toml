[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qtm-cryptography"
version = "0.1.0"
description = "Quantum attacks on symmetric cryptography using Simon's algorithm"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
